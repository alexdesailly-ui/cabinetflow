# Contrôles sur chaque PR et chaque push : rien n'arrive sur main sans être vert.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Taille du bundle (alerte au-delà de 250 Ko gzip)
        run: |
          taille=$(gzip -c dist/index.html | wc -c)
          echo "index.html gzip : $((taille / 1024)) Ko"
          test "$taille" -lt 256000
      - name: Dépendances livrées sans vulnérabilité haute
        run: npm audit --omit=dev --audit-level=high

  base:
    name: Base de données (RLS, isolation, RGPD)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/db-test.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  fonctions:
    name: Edge Functions (typage Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check stripe-checkout/index.ts stripe-portal/index.ts stripe-webhook/index.ts
        working-directory: supabase/functions

  secrets:
    name: Aucun secret dans l'historique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --config .gitleaks.toml .
