# Production : https://cabinetflow.fr (hébergement mutualisé, déploiement par FTP).
# MANUEL uniquement : Actions → « Déployer la prod (Hostinger) » → Run workflow → taper DEPLOYER.
# Secret requis dans CE dépôt : FTP_PASS (Settings → Secrets and variables → Actions).
# Variables facultatives : VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY (mode comptes réels),
# HOSTINGER_FTP_HOST / HOSTINGER_FTP_USER / HOSTINGER_REMOTE_DIR (sinon valeurs par défaut ci-dessous).
name: Déployer la prod (Hostinger)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tapez DEPLOYER pour confirmer la mise en production sur cabinetflow.fr'
        required: true

permissions:
  contents: read

concurrency:
  group: prod-hostinger
  cancel-in-progress: false

env:
  FTP_HOST: ${{ vars.HOSTINGER_FTP_HOST || '145.79.20.5' }}
  # Compte FTP propre au site cabinetflow.fr (hPanel → Fichiers → Comptes FTP).
  FTP_USER: ${{ vars.HOSTINGER_FTP_USER || 'u398408214.cabinetflow.fr' }}
  # Dossier préféré ; sinon détecté automatiquement (voir étape « Trouver le dossier »).
  REMOTE_DIR_PREFERE: ${{ vars.HOSTINGER_REMOTE_DIR || '' }}

jobs:
  deploy:
    name: Build, tests, envoi FTP
    runs-on: ubuntu-latest
    if: inputs.confirmation == 'DEPLOYER' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://cabinetflow.fr/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Préparer le dossier publié
        run: |
          rm -f dist/artifact.html
          test -f dist/index.html && test -f dist/.htaccess && test -f dist/og.png
          ls -la dist
      - name: Vérifier le secret
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: test -n "$FTP_PASS" || { echo "::error::Secret FTP_PASS absent de ce dépôt (Settings → Secrets and variables → Actions)"; exit 1; }
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Trouver le dossier du site
        id: dossier
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          set +e
          # Un compte FTP propre à un site arrive souvent déjà dans le bon dossier ; un compte général, non.
          for d in "$REMOTE_DIR_PREFERE" public_html domains/cabinetflow.fr/public_html /domains/cabinetflow.fr/public_html /public_html .; do
            [ -z "$d" ] && continue
            sortie=$(lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" -e "set ssl:verify-certificate no; set net:max-retries 1; set net:timeout 15; cd $d && echo DOSSIER_OK; bye" 2>&1)
            if echo "$sortie" | grep -q DOSSIER_OK; then echo "Dossier retenu : $d"; echo "dir=$d" >> "$GITHUB_OUTPUT"; exit 0; fi
            if echo "$sortie" | grep -q "530"; then echo "::error::Connexion FTP refusée (530) pour $FTP_USER : vérifier l'identifiant et le secret FTP_PASS"; exit 1; fi
          done
          echo "::error::Aucun dossier de site trouvé pour $FTP_USER"
          exit 1
      - name: Envoi vers Hostinger
        env:
          FTP_PASS: ${{ secrets.FTP_PASS }}
          DIR: ${{ steps.dossier.outputs.dir }}
        run: |
          timeout 300 lftp -u "$FTP_USER,$FTP_PASS" "$FTP_HOST" <<LFTP
          set ssl:verify-certificate no
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          cd $DIR
          echo ">>> AVANT :"
          cls -l
          rm -f default.php maintenance.html coming-soon.html
          mirror --reverse --verbose dist/ ./
          echo ">>> APRÈS :"
          cls -l
          bye
          LFTP
      - name: Vérification en ligne
        run: |
          sleep 5
          code=$(curl -s -o page.html -w '%{http_code}' https://cabinetflow.fr/)
          echo "HTTP $code"
          test "$code" = 200 && grep -q 'Relève' page.html
