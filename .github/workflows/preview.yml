# Déploiement de prévisualisation automatique sur chaque PR (Cloudflare Pages, gratuit).
# Inactif tant que les secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ne sont pas posés.
# Les variables VITE_SUPABASE_* (onglet Variables du dépôt) branchent la preview sur un projet
# Supabase de préproduction ; absentes, la preview est la démo locale.
name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Secrets absents → étape ignorée
        if: env.CF_TOKEN == ''
        run: echo "::notice::Preview désactivée (voir README, section Déploiement)."
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CF_TOKEN != ''
        run: npm ci && npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL_PREVIEW }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY_PREVIEW }}
      - id: deploiement
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=releve --branch=pr-${{ github.event.number }}
      - if: env.CF_TOKEN != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploiement.outputs.deployment-url }}'
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number,
              body: `Preview : ${url}\n\n---\n_Généré par la CI_` })
