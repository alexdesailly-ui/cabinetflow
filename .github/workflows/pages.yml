# SECOURS : publie l'application sur GitHub Pages — MANUELLEMENT uniquement.
# La production est sur Hostinger (deploy-hostinger.yml → https://cabinetflow.fr).
# URL : https://alexdesailly-ui.github.io/cabinetflow/
# Avec les variables de dépôt VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY, la prod
# est en mode cloud (comptes réels) ; sans elles, c'est la démo locale.
name: Déployer le secours (GitHub Pages)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Tapez DEPLOYER pour confirmer la mise en production'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: inputs.confirmation == 'DEPLOYER' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Le routage se fait par hash : la même page sert toutes les adresses.
      - run: cp dist/index.html dist/404.html && rm -f dist/artifact.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
