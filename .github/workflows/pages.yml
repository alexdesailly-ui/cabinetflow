# Publie l'application de démonstration sur GitHub Pages à chaque push.
# URL : https://alexdesailly-ui.github.io/cabinetflow/
name: Déployer la démo

on:
  push:
    branches: [claude/saas-nursing-jobs-concept-60zgzx, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Le routage se fait par hash : la même page sert toutes les adresses.
      - run: cp dist/index.html dist/404.html && rm -f dist/artifact.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
